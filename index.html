<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moths &amp; Fishers v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1810;--panel:#142a1d;--panel2:#1d3a28;--line:#b8651f;--acc:#e8903a;--gold:#f2c079;--text:#f3ead6;--mute:#b9b49c;--board:#1b3a25;--rw:min(60vw,calc((100vh - 96px)*1.3333))}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at top,#16301f,var(--bg) 70%) fixed;color:var(--text);font:19px/1.3 "EB Garamond","Times New Roman",Times,serif}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:.2rem .8rem;cursor:pointer}
button:hover:not(:disabled),.btn:hover{border-color:var(--acc);background:#244a31}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--acc);color:#1a0f05;border-color:var(--acc);font-weight:700}
.pri:hover:not(:disabled){background:var(--gold)}
input[type=text],select,textarea{background:#0a150e;border:1px solid var(--line);border-radius:6px;padding:.25rem .6rem;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
input::placeholder,textarea::placeholder{color:#8f9a82}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
.mute{color:var(--mute)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 14px #0007}
h1,h2{font-weight:500;font-variant:small-caps;letter-spacing:.05em;color:var(--gold);margin:0}
.row{display:flex;gap:.5rem;align-items:center}.row>input{flex:1}
.av{width:46px;height:46px;border:2px solid var(--line);border-radius:50%;object-fit:cover;cursor:pointer;display:block;background:#0a150e;flex:none}

/* pantallas de entrada */
.scr{max-width:460px;margin:9vh auto;padding:1.6rem;display:grid;gap:.9rem}
.scr.wide{max-width:660px;margin:3vh auto}
.scr h1{font-size:2.4rem;text-align:center}.scr h1 small{font-size:.5em;color:var(--mute)}
.saved{display:flex;flex-wrap:wrap;gap:.4rem}
.slots4{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.sl{display:grid;gap:.25rem;justify-items:center;text-align:center;font-size:.9rem}
.prev{width:100%;aspect-ratio:1;border:2px solid var(--line);border-radius:6px;overflow:hidden;display:grid;place-items:center;color:var(--mute);background:#0006}
.prev img{width:100%;height:100%;object-fit:cover}

/* sala */
#app{display:grid;gap:10px;padding:10px;height:100%;max-width:1800px;margin:0 auto;align-content:center;
  grid-template-columns:minmax(240px,1fr) var(--rw);grid-template-rows:auto 56px;grid-template-areas:"chat board" "chat bar"}
#board{grid-area:board;position:relative;container-type:size;aspect-ratio:4/3;background:var(--board);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 3px 14px #0007}
#bgbox,.bgl,#vig{position:absolute;inset:0}
.bgl{background:var(--board) center/100% 100% no-repeat;opacity:0;transition:opacity 2s ease}
.bgl.in{opacity:1}
#vig{z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.42) 100%)}
#slots{position:absolute;z-index:2;left:1.2cqh;top:2cqh;width:24cqh;height:96cqh;display:grid;grid-template-rows:repeat(4,1fr)}
.slot{position:relative;min-height:0}
.fr{position:absolute;inset:0;border:3px solid var(--line);background:#00000066;overflow:hidden;transition:box-shadow .25s,border-color .25s}
.slot+.slot .fr{border-top-width:0}
.fr.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--acc),0 0 22px var(--acc);z-index:1}
.fr.dead{background:#000}
.fr img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.slot.empty .fr{opacity:.45}
.cap{background:#000b;padding:0 .6em;font-size:clamp(12px,2cqw,20px);font-style:italic;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .cap{position:absolute;left:0;right:0;bottom:0}
#npcs{position:absolute;z-index:2;left:calc(24cqh + 6cqw);right:3cqw;top:5cqh;bottom:22cqh;display:flex;justify-content:center;align-items:flex-end;gap:2cqw;pointer-events:none}
.npc{flex:0 1 33%;min-width:0;max-height:100%;display:flex;flex-direction:column;align-items:center;gap:.3em}
.npc img{max-width:100%;min-height:0;max-height:100%;object-fit:contain}
.npc .cap{border-radius:999px;border:1px solid #b8651f88;max-width:100%}
#narr{position:absolute;z-index:4;left:calc(24cqh + 5cqw);right:3cqw;bottom:3cqh;background:rgba(8,18,11,.88);border:1px solid var(--line);border-radius:10px;padding:.45em 1em;text-align:center;font-size:clamp(15px,2.4cqw,26px);opacity:0;transition:opacity 1s ease;pointer-events:none}
#narr.show{opacity:1}
#narr b{display:block;color:var(--gold);font-variant:small-caps;letter-spacing:.05em}
#narr p{margin:.1em 0 0;overflow-wrap:anywhere}

#chat{grid-area:chat;display:flex;flex-direction:column;min-height:0}
.chathead{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;border-bottom:1px solid var(--line)}
.chathead h2{font-size:1.5rem;letter-spacing:.15em}
#offbtn{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;padding:0;font-weight:700;font-size:.95rem}
#offbtn.on{background:var(--acc);color:#1a0f05}
#offbtn.dot::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:#ff5a4a}
.chatbody{position:relative;flex:1;min-height:0}
.chatbody::before{content:"Moths & Fishers";position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1rem;font-size:clamp(34px,5vw,72px);font-variant:small-caps;letter-spacing:.06em;color:var(--gold);opacity:.07;pointer-events:none}
#log{position:absolute;inset:0;overflow-y:auto;padding:.6rem;display:grid;gap:.5rem;align-content:start}
.msg{display:flex;gap:.5rem;align-items:flex-start}
.msg>div{flex:1;min-width:0}
.pic{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;object-fit:cover;flex:none;background:#0a150e}
.msg b.who{color:var(--gold)}.msg p{margin:0;overflow-wrap:anywhere}
.sys{color:var(--mute);font-style:italic}
.narrmsg p{font-style:italic}
.del{border:0;background:none;color:#ff5a4a;font-weight:700;padding:0 .35rem;flex:none}
.res{display:inline-block;background:#0a150e;border:1px solid var(--line);border-radius:6px;padding:0 .5rem;font-weight:700}
.crit{color:var(--gold);border-color:var(--gold)}.fail{color:#ff9a8a}
#cf{display:flex;border-top:1px solid var(--line);height:52px}
#cf input{flex:1;border:0;border-radius:0 0 0 10px;background:transparent;padding:.4rem .8rem}
#cf button{border:0;border-left:1px solid var(--line);border-radius:0;background:var(--acc);color:#1a0f05;font-weight:700;width:96px;padding:0}
#cf button:last-child{border-radius:0 0 10px 0}
#cf button:hover:not(:disabled){background:var(--gold)}

#bar{grid-area:bar;display:grid;grid-template-columns:2fr 3fr 1fr 1fr;gap:10px;min-width:0}
#bar>*{min-width:0}
#dice{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
#dice button{border:0;border-radius:0;font-size:1.25rem;background:transparent;padding:0}
#dice button+button{border-left:1px solid var(--line)}
#dice button:hover:not(:disabled){background:var(--panel2)}
#estwrap{position:relative}
#estbtn,#gear,#exit{width:100%;height:100%;padding:0}
#gear{font-size:1.6rem;line-height:1}
#estpop{position:absolute;bottom:calc(100% + 8px);left:0;z-index:20;min-width:min(320px,90vw);max-height:60vh;overflow:auto;padding:.7rem;display:grid;gap:.6rem}
.e2,.erow{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.erow>span{grid-column:1/-1;color:var(--gold);font-weight:700}
.esec{display:grid;gap:.25rem;justify-items:start}
.esec b{font-size:.9rem;color:var(--mute);font-weight:500;font-variant:small-caps}
.chip{padding:0 .8rem;border:1px solid #000;border-radius:999px;font-weight:700;color:#fff}
.k-g{background:#6aa84f;color:#10200f}.k-a{background:#e0a03a;color:#1a1005}.k-r{background:#c4422b}.k-d{background:#8b1d1d}.k-k{background:#000;border-color:var(--line)}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;width:min(640px,94vw);max-height:92vh;padding:1.2rem}
dialog::backdrop{background:#000b}
dialog>div{display:grid;gap:.6rem}
dialog h2{font-size:1.6rem}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.menu button{padding:.5rem}
#npclib{display:flex;flex-wrap:wrap;gap:.5rem}
.ch{position:relative;width:84px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.25rem;cursor:pointer}
.ch.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--acc)}
.ch img{width:100%;height:60px;object-fit:cover;border-radius:6px;display:block}
.ch span{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .x{position:absolute;top:-9px;right:-9px;padding:0 .4rem;border-radius:50%;line-height:1.2}
#pdet p{margin:.1rem 0;white-space:pre-wrap}
.sep{border-top:1px solid var(--line);padding-top:.6rem;display:grid;gap:.5rem}

@media(max-width:860px){
  #app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"board" "bar" "chat"}
  #chat{height:60vh}
  #bar{height:56px}
}
@media(prefers-reduced-motion:reduce){.bgl,.fr,#narr{transition:none}}
</style>
</head>
<body>
<section id="home" class="box scr">
  <h1>Moths &amp; Fishers <small>v5</small></h1>
  <button id="bDM" class="pri">Soy DM</button>
  <button id="bPL">Soy jugador</button>
</section>

<section id="dmform" class="box scr hide">
  <h2>Soy DM</h2>
  <input id="dmname" type="text" placeholder="Tu nombre" maxlength="24" aria-label="Tu nombre">
  <button id="mk" class="pri">Crear sala</button>
  <button data-go="home">← Volver</button>
  <p class="status mute" style="margin:0" role="status"></p>
</section>

<section id="plform" class="box scr wide hide">
  <h2>Soy jugador</h2>
  <div id="saved" class="saved"></div>
  <div id="plEditor" style="display:grid;gap:.6rem"></div>
  <div class="row"><input type="text" id="code" placeholder="Código de sala" maxlength="4" aria-label="Código de sala"><button id="jn" class="pri">Entrar</button></div>
  <button data-go="home">← Volver</button>
  <p class="status mute" style="margin:0" role="status"></p>
</section>

<div id="app" class="hide">
  <aside id="chat" class="box">
    <div class="chathead"><button id="offbtn" title="Cambiar entre chat principal y chat fuera de rol">Off</button><h2 id="chtitle">Chat</h2></div>
    <div class="chatbody"><div id="log" aria-live="polite"></div></div>
    <form id="cf"><input id="ct" type="text" maxlength="500" autocomplete="off" aria-label="Mensaje"><button id="sendbtn">Comentar</button><button id="narrbtn" type="button" class="dmonly hide">Narrar</button></form>
  </aside>

  <div id="board">
    <div id="bgbox"></div><div id="vig"></div>
    <div id="slots">
      <div class="slot"><div class="fr"><img alt="" class="hide"><div class="cap hide"></div></div></div>
      <div class="slot"><div class="fr"><img alt="" class="hide"><div class="cap hide"></div></div></div>
      <div class="slot"><div class="fr"><img alt="" class="hide"><div class="cap hide"></div></div></div>
      <div class="slot"><div class="fr"><img alt="" class="hide"><div class="cap hide"></div></div></div>
    </div>
    <div id="npcs"></div>
    <div id="narr"><b id="narrn"></b><p id="narrt"></p></div>
  </div>

  <div id="bar">
    <div id="dice" class="box"><button id="dbtn" title="Tirar d20">🎲 d20</button><button id="cbtn" title="Lanzar moneda">🪙</button></div>
    <div id="estwrap"><button id="estbtn" class="box">Estado</button><div id="estpop" class="box hide"></div></div>
    <button id="gear" class="box" aria-label="Ajustes" title="Ajustes">⚙</button>
    <button id="exit" class="box">Salir</button>
  </div>
</div>

<dialog id="dlg">
  <div id="vMain">
    <h2>Moths and Fishers v5</h2>
    <p style="margin:0">Jugadores activos: <b id="actn"></b> · Código: <b id="codeshow"></b></p>
    <div class="menu">
      <button id="copycode">Copiar código</button>
      <button id="goEdit" class="plonly">Editar personaje</button>
      <button id="goList">Lista de personajes</button>
      <button id="goDM" class="dmonly hide">DM</button>
      <button id="sndbtn">Sonido: sí</button>
    </div>
  </div>
  <div id="vEdit" class="hide">
    <h2>Editar personaje</h2>
    <div id="setEditor" style="display:grid;gap:.6rem"></div>
    <div class="row"><button id="saveEdit" class="pri">Guardar</button><button class="bk">← Volver</button></div>
  </div>
  <div id="vList" class="hide">
    <h2>Lista de personajes</h2>
    <div id="plist" class="menu"></div>
    <button class="bk">← Volver</button>
  </div>
  <div id="vDetail" class="hide">
    <div id="pdet"></div>
    <button id="backList">← Volver a la lista</button>
  </div>
  <div id="vDM" class="hide">
    <h2>DM</h2>
    <div class="sep"><b>Fondo</b>
      <div class="row"><label class="btn">Cambiar fondo<input id="bgfile" type="file" accept="image/*" hidden></label><button id="bgclear">Quitar fondo</button></div></div>
    <div class="sep"><b>NPCs</b>
      <span class="mute">Toca un NPC para mostrarlo u ocultarlo en el tablero (máx. 3). PNG o GIF, máx. 3 MB.</span>
      <div id="npclib"></div>
      <div class="row"><input id="npcname" type="text" placeholder="Nombre del NPC" maxlength="24"><label class="btn">Añadir NPC<input id="npcfile" type="file" accept="image/*" hidden></label><button id="npcclear">Quitar</button></div>
      <div class="row"><span>Nombre del narrador:</span><input id="narrname" type="text" maxlength="24" placeholder="Narrador"></div></div>
    <div class="sep"><b>Jugadores</b><div id="kicklist" style="display:grid;gap:.4rem"></div></div>
    <div class="sep"><b>Partida</b>
      <div class="row"><button id="savegame">Guardar partida</button><label class="btn">Cargar partida<input id="loadgame" type="file" accept=".json,application/json" hidden></label></div></div>
    <button class="bk">← Volver</button>
  </div>
  <button id="closedlg" style="margin-top:.8rem">Cerrar</button>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const clip=(s,n)=>String(s==null?'':s).slice(0,n);
const rid=()=>Math.random().toString(36).slice(2,10);
const rnd=()=>crypto.getRandomValues(new Uint32Array(1))[0];
const okImg=(s,n)=>typeof s==='string'&&s.startsWith('data:image/')&&s.length<n;
const PFX='dndvn-',MAXP=4,MAXIMG=4300000,GIFMAX=3*1024*1024,LIFE=10*60*1000;
const PH=['Estable','Herido','Fatal','Moribundo','Muerto'],MS=['Estable','Afligido','Decaído','…'];
const CHIP={Estable:'g',Herido:'a',Fatal:'r',Moribundo:'d',Muerto:'k',Afligido:'a','Decaído':'r','…':'d'};
const ALIGN=['Legal bueno','Neutral bueno','Caótico bueno','Legal neutral','Neutral','Caótico neutral','Legal malvado','Neutral malvado','Caótico malvado'];
const SL=[['rest','Neutral'],['talk','Hablando'],['fall','Moribundo'],['moral','Derrota moral']];
let peer,isHost=false,conns=[],hostConn=null,me='',roomCode='',dmName='',view='main';
let chars=[],npcLib=[],HP={},SAVED={},myHp={b:'Estable',m:'Estable'};
const blankChar=()=>({id:'',name:'',av:'',bio:'',align:'',rest:'',talk:'',fall:'',moral:''});
let draft=blankChar();
let S={bg:'',npcs:[],players:{},order:[],turn:0,chat:[],ooc:[]};
let prof={narr:'',mute:false,dm:''};
try{Object.assign(prof,JSON.parse(localStorage.getItem('prof2')||'{}'))}catch(e){}
const saveProf=()=>{try{localStorage.setItem('prof2',JSON.stringify(prof))}catch(e){}};

/* ---------- guardado local (IndexedDB): personajes y NPCs ---------- */
const idb=new Promise((ok,no)=>{const r=indexedDB.open('mesa',1);r.onupgradeneeded=()=>r.result.createObjectStore('chars',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=(m,f)=>idb.then(d=>new Promise((ok,no)=>{const r=f(d.transaction('chars',m).objectStore('chars'));r.onsuccess=()=>ok(r.result);r.onerror=no}));
const dbAll=()=>tx('readonly',s=>s.getAll()),dbPut=c=>tx('readwrite',s=>s.put(c)),dbDel=id=>tx('readwrite',s=>s.delete(id));
dbAll().then(a=>{
  chars=a.filter(c=>c.kind!=='npc').map(c=>({...blankChar(),...c}));
  npcLib=a.filter(c=>c.kind==='npc');renderSaved();
}).catch(()=>{});

/* ---------- utilidades de imagen ---------- */
function avSrc(name,av){
  if(av)return av;
  const ch=(name||'?')[0].replace(/[<>&]/g,'?');
  return 'data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='#1d3a28'/><text x='20' y='27' font-size='22' text-anchor='middle' fill='#f2c079' font-family='serif'>"+ch+"</text></svg>");
}
function shrink(file,max,type,q){return new Promise((ok,no)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL(type,q))};
  img.onerror=no;img.src=u;
})}
function toSprite(f){ /* los GIF se guardan tal cual para conservar la animación */
  if(f.type==='image/gif'){
    if(f.size>GIFMAX){alert('El GIF «'+f.name+'» pesa más de 3 MB. Comprímelo e inténtalo de nuevo.');return Promise.reject()}
    return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
  }
  return shrink(f,480,'image/png',1);
}
function setImg(im,src){
  if(src){if(im.getAttribute('src')!==src)im.src=src;im.classList.remove('hide')}
  else{im.removeAttribute('src');im.classList.add('hide')}
}
/* *cursiva* y **negrita** (sin innerHTML) */
function fmt(p,text){
  String(text).split(/(\*\*[^*]+\*\*|\*[^*]+\*)/).forEach(s=>{
    if(s.length>4&&s.startsWith('**')&&s.endsWith('**'))p.append(el('strong','',s.slice(2,-2)));
    else if(s.length>2&&s[0]==='*'&&s.endsWith('*'))p.append(el('em','',s.slice(1,-1)));
    else if(s)p.append(s);
  });
}

/* ---------- editor de personaje (entrada y ajustes) ---------- */
function renderEditor(root){
  root.replaceChildren();
  const top=el('div','row'),lb=el('label'),im=el('img','av');im.src=avSrc(draft.name,draft.av);im.title='Cambiar foto';
  const fi=el('input');fi.type='file';fi.accept='image/*';fi.hidden=true;
  fi.onchange=async()=>{const f=fi.files[0];if(!f)return;try{draft.av=await shrink(f,96,'image/jpeg',.8);renderEditor(root)}catch(x){}};
  lb.append(im,fi);
  const nm=el('input');nm.type='text';nm.maxLength=24;nm.placeholder='Nombre del personaje';nm.value=draft.name;nm.oninput=()=>{draft.name=nm.value};
  top.append(lb,nm);
  const bio=el('textarea');bio.placeholder='¿Quién es?';bio.maxLength=600;bio.value=draft.bio;bio.oninput=()=>{draft.bio=bio.value};
  const al=el('select');
  [['','Alineamiento…']].concat(ALIGN.map(a=>[a,a])).forEach(([v,t])=>{const o=el('option','',t);o.value=v;al.append(o)});
  al.value=draft.align;al.onchange=()=>{draft.align=al.value};
  const row=el('div','slots4');
  SL.forEach(([k,lab])=>{
    const d=el('div','sl');d.append(el('b','',lab));
    const pv=el('div','prev');
    if(draft[k]){const i=el('img');i.src=draft[k];i.alt=lab;pv.append(i)}else pv.textContent='vacío';
    const l2=el('label','btn','Subir'),f2=el('input');f2.type='file';f2.accept='image/*';f2.hidden=true;
    f2.onchange=async()=>{const f=f2.files[0];if(!f)return;try{draft[k]=await toSprite(f);renderEditor(root)}catch(x){}};
    l2.append(f2);d.append(pv,l2);
    if(draft[k]){const x=el('button','','Quitar');x.onclick=()=>{draft[k]='';renderEditor(root)};d.append(x)}
    row.append(d);
  });
  root.append(top,bio,al,el('span','mute','Sprites (PNG o GIF, máx. 3 MB):'),row);
}

function hostRoom(){
  dmName=$('#dmname').value.trim();
  if(typeof Peer==='undefined'){setStatus('No se pudo cargar PeerJS. Revisa tu conexión.');return}
  if(!dmName){setStatus('Escribe tu nombre para continuar.');return}
  prof.dm=dmName;saveProf();askNotif();
  isHost=true;me='host';
  const code=Math.random().toString(36).slice(2,6).toUpperCase();
  setStatus('Creando sala…');
  peer=new Peer(PFX+code);
  const to=setTimeout(()=>setStatus(SLOW),10000);
  peer.on('open',()=>{clearTimeout(to);enter(code);sysMsg('Sala creada. Código: '+code)});
  peer.on('connection',c=>{
    c.on('open',()=>{conns.push(c);c.send({t:'state',s:S,now:Date.now()})});
    c.on('data',m=>process(m,c));
    c.on('close',()=>{
      conns=conns.filter(x=>x!==c);const p=S.players[c.peer];
      if(p){SAVED[p.n]=HP[c.peer];out({t:'left',id:c.peer});delete HP[c.peer];sysMsg(p.n+' salió');fixTurn()}
    });
  });
  peer.on('error',e=>{if(e.type==='unavailable-id'){clearTimeout(to);peer.destroy();hostRoom()}else setStatus('Error: '+e.type)});
}
async function joinRoom(){
  const code=$('#code').value.trim().toUpperCase();
  if(typeof Peer==='undefined'){setStatus('No se pudo cargar PeerJS. Revisa tu conexión.');return}

  if(!code){setStatus('Escribe el código de la sala.');return}
  askNotif();await upsertChar();
  setStatus('Conectando…');
  peer=new Peer();
  const to=setTimeout(()=>setStatus(SLOW),10000);
  peer.on('open',id=>{
    me=id;hostConn=peer.connect(PFX+code,{reliable:true});
    hostConn.on('open',()=>{clearTimeout(to);enter(code);hostConn.send({t:'hello',...charMsg()})});
    hostConn.on('data',apply);
    hostConn.on('close',()=>{if(S.chat)addMsg({t:'sys',text:'Se perdió la conexión con el DM.'})});
  });

}

/* ---------- lado DM: valida y reparte ---------- */
function nextTurn(){
  const n=S.order.length;
  for(let k=1;k<=n;k++){const i=(S.turn+k)%n,p=S.players[S.order[i]];if(p&&!p.dead)return i}
  return S.turn;
}
function fixTurn(){const p=S.players[S.order[S.turn]];if(p&&p.dead){const t=nextTurn();if(t!==S.turn)out({t:'turn',turn:t})}}
function setHp(id,b,m){
  HP[id]={b,m};const cc=conns.find(x=>x.peer===id);
  if(cc&&cc.open)cc.send({t:'hp',b,m});
  out({t:'flags',id,down:b==='Moribundo',dead:b==='Muerto',brk:m==='…'});
  fixTurn();renderEstado();
}
function process(m,c){
  const who=c?c.peer:'host',t=m.t,H=who==='host';
  if(t==='hello'){
    if(!c||S.players[who])return;
    if(S.order.length>=MAXP){c.send({t:'full'});setTimeout(()=>c.close(),400);return}
    const p={...cleanChar(m),down:false,dead:false,brk:false},sv=SAVED[p.n];
    HP[who]={b:sv&&PH.includes(sv.b)?sv.b:'Estable',m:sv&&MS.includes(sv.m)?sv.m:'Estable'};
    p.down=HP[who].b==='Moribundo';p.dead=HP[who].b==='Muerto';p.brk=HP[who].m==='…';
    out({t:'join',id:who,p});c.send({t:'hp',b:HP[who].b,m:HP[who].m});sysMsg(p.n+' se unió');return;
  }
  if(!H&&!S.players[who])return;
  const p=S.players[who];
  const okMain=H||(S.order[S.turn]===who&&!p.dead); /* chat principal: solo quien tiene el turno y sigue vivo (el DM siempre) */
  const base=()=>({id:rid(),ts:Date.now(),from:who,name:H?dmName+' (DM)':p.n,av:H?'':p.av,dm:H});
  if(t==='chat'){
    const text=clip(m.text,500);
    if(text.trim()&&okMain){out({t,...base(),text});if(!H&&S.order.length)out({t:'turn',turn:nextTurn()})} /* al enviar, pasa el turno */
  }
  else if(t==='ooc'){const text=clip(m.text,500);if(text.trim())out({t,...base(),text})}
  else if(t==='narr'){const text=clip(m.text,400);if(H&&text.trim())out({t,id:rid(),ts:Date.now(),from:who,dm:true,name:clip(m.name,24).trim()||'Narrador',text})}
  else if(t==='roll'){if(okMain&&m.die===20)out({t,...base(),die:20,r:1+rnd()%20})}
  else if(t==='coin'){if(okMain)out({t,...base(),r:rnd()%2?'Cara':'Cruz'})}
  else if(t==='delmsg'){if(H)out({t,id:clip(m.id,20)})}
  else if(t==='char'){if(!H)out({t,id:who,c:cleanChar(m)})}
  else if(t==='bg'){if(H)out({t,src:m.src&&okImg(m.src,2000000)?m.src:''})}
  else if(t==='npcs'){
    if(H&&Array.isArray(m.list))out({t,list:m.list.slice(0,3).filter(n=>okImg(n.src,MAXIMG)).map(n=>({id:clip(n.id,20),src:n.src,name:clip(n.name,24)}))});
  }
  else if(t==='kick'){if(H){const cc=conns.find(x=>x.peer===m.id);if(cc){cc.send({t:'kicked'});setTimeout(()=>cc.close(),300)}}}
  else if(t==='hpset'){
    const id=String(m.id),h=HP[id];
    if(!S.players[id]||!h||!(H||(id===who&&h.b==='Muerto')))return; /* un jugador muerto sí puede cambiar su estado */
    setHp(id,PH.includes(m.b)?m.b:h.b,MS.includes(m.m)?m.m:h.m);
  }
}

/* ---------- todos: aplican cambios ---------- */
function pushChat(m,k){
  m._at=Date.now();S[k].push(m);if(S[k].length>100)S[k].shift();
  if(view===(k==='chat'?'main':'ooc'))addMsg(m);else $('#offbtn').classList.add('dot');
  if(k==='chat'&&m.t!=='sys'&&m.from!==me)notify(m);
}
function apply(m){
  switch(m.t){
    case 'state':{S=m.s;const off=Date.now()-m.now;['chat','ooc'].forEach(k=>S[k].forEach(x=>{x._at=x.ts?x.ts+off:Date.now()}));renderAll();break}
    case 'full':alert('La sala está llena (máximo 4 jugadores sin contar al DM).');location.reload();break;
    case 'kicked':alert('El DM te ha expulsado de la sala.');location.reload();break;
    case 'hp':myHp={b:m.b,m:m.m};renderEstado();break;
    case 'join':S.players[m.id]=m.p;if(!S.order.includes(m.id))S.order.push(m.id);renderPlayers();break;
    case 'left':{const i=S.order.indexOf(m.id);if(i<0)break;S.order.splice(i,1);delete S.players[m.id];
      if(i<S.turn)S.turn--;if(S.turn>=S.order.length)S.turn=0;renderPlayers();break}
    case 'char':{const p=S.players[m.id];if(p){Object.assign(p,m.c);renderPlayers()}break}
    case 'flags':{const p=S.players[m.id];if(p){p.down=m.down;p.dead=m.dead;p.brk=m.brk;renderSlots();renderLocks();renderLists()}break}
    case 'turn':S.turn=m.turn;renderSlots();renderLocks();break;
    case 'npcs':S.npcs=m.list;renderNpcs();if(isHost)renderDM();break;
    case 'bg':S.bg=m.src;renderBg();break;
    case 'narr':pushChat(m,'chat');narrate(m);break;
    case 'chat':case 'roll':case 'coin':case 'sys':pushChat(m,'chat');break;
    case 'ooc':pushChat(m,'ooc');break;
    case 'delmsg':
      ['chat','ooc'].forEach(k=>{S[k]=S[k].filter(x=>x.id!==m.id)});
      document.querySelectorAll('.msg').forEach(e=>{if(e.dataset.id===m.id)e.remove()});break;
  }
}

/* ---------- mensajes que expiran a los 10 minutos ---------- */
setInterval(()=>{
  const cut=Date.now()-LIFE;
  ['chat','ooc'].forEach(k=>{
    const keep=S[k].filter(m=>(m._at||Date.now())>cut);
    if(keep.length!==S[k].length){
      const alive=new Set(keep.map(m=>m.id));S[k]=keep;
      document.querySelectorAll('.msg').forEach(e=>{if(e.dataset.id&&!alive.has(e.dataset.id)&&e.dataset.k===k)e.remove()});
    }
  });
},5000);

/* ---------- notificaciones ---------- */
let AC,unread=0;
function bell(){
  if(prof.mute)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const t=AC.currentTime;
    [[660,.16],[1820,.08],[3560,.04]].forEach(([f,g])=>{
      const o=AC.createOscillator(),v=AC.createGain();o.type='sine';o.frequency.value=f;
      v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+.5);
      o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+.55);
    });
  }catch(e){}
}
function notify(m){
  bell();
  if(document.hidden){
    unread++;document.title='('+unread+') Moths & Fishers v5';
    try{if(window.Notification&&Notification.permission==='granted')new Notification(m.name,{body:m.text||(m.t==='roll'?'🎲 '+m.r:'🪙 '+m.r),silent:true})}catch(e){}
  }
}

};
$('#npcclear').onclick=()=>send({t:'npcs',list:[]});
$('#narrname').oninput=e=>{prof.narr=e.target.value;saveProf()};
$('#bgfile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{send({t:'bg',src:await shrink(f,1280,'image/jpeg',.82)})}catch(x){}
};
$('#bgclear').onclick=()=>send({t:'bg',src:''});
$('#savegame').onclick=()=>{
  const pl=Object.assign({},SAVED);S.order.forEach(id=>{pl[S.players[id].n]=HP[id]});
  const data={app:'moths-fishers',v:5,bg:S.bg,npcs:S.npcs,players:pl};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download='partida-moths-fishers.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$('#loadgame').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let d;try{d=JSON.parse(await f.text());if(d.app!=='moths-fishers')throw 0}catch(x){alert('Ese archivo no es una partida válida.');return}
  SAVED=d.players||{};S.bg=okImg(d.bg,2000000)?d.bg:'';
  S.npcs=(Array.isArray(d.npcs)?d.npcs:[]).slice(0,3).filter(n=>okImg(n.src,MAXIMG)).map(n=>({id:clip(n.id,20),src:n.src,name:clip(n.name,24)}));
  S.order.forEach(id=>{const sv=SAVED[S.players[id].n];if(sv)setHp(id,PH.includes(sv.b)?sv.b:'Estable',MS.includes(sv.m)?sv.m:'Estable')});
  conns.forEach(c=>{if(c.open)c.send({t:'state',s:S,now:Date.now()})});
  renderAll();sysMsg('Partida cargada.');
};

/* ---------- chat, dados y salida ---------- */
$('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ct').value.trim();if(v){send({t:view==='main'?'chat':'ooc',text:v});$('#ct').value=''}};
$('#narrbtn').onclick=()=>{const v=$('#ct').value.trim();if(v){send({t:'narr',text:v,name:prof.narr});$('#ct').value=''}};
$('#dbtn').onclick=()=>send({t:'roll',die:20});
$('#cbtn').onclick=()=>send({t:'coin'});
$('#offbtn').onclick=()=>{
  view=view==='main'?'ooc':'main';
  $('#offbtn').classList.toggle('on',view==='ooc');$('#offbtn').classList.remove('dot');
  renderLog();renderLocks();
};
$('#exit').onclick=()=>{
  if(confirm(isHost?'Cerrarás la sala para todos. ¿Salir?':'¿Salir de la sala?')){try{peer&&peer.destroy()}catch(e){}location.reload()}
};
</script>
</body>
</html>
